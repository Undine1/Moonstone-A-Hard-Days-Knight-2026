; Moonstone controls
; ------------------
; Edit this file, save it beside moonstone.exe, then restart the game.
; Names are case-insensitive. Separate multiple bindings with commas.
; Use "none" by itself to unbind an action on that device.
; If a line is invalid, that action keeps its previous working binding.
;
; Keyboard names include letters, arrows, Space, Return, Keypad Enter,
; Left Ctrl, Right Ctrl, Escape, and F1-F9. F10 and F12 are reserved.
;
; Controller names:
;   A, B, X, Y, Back (or Select), Start, LB, RB, L3, R3
;   D-pad Up/Down/Left/Right
;   Left Stick Up/Down/Left/Right
;   Right Stick Up/Down/Left/Right
;   Left Trigger (or LT), Right Trigger (or RT)
;
; Mouse movement, left-click, name typing, Backspace, Enter, and the
; numbered popup choices remain fixed. The original game has no separate
; Back/Cancel action.

[keyboard]
up = Up
down = Down
left = Left
right = Right
attack_select = Left Ctrl, Right Ctrl, Return, Keypad Enter
inventory = Space, I
pause = Space
end_turn = E
abandon_quest = Q
show_version = V
quit = Escape
quicksave = F5
quickload = F9
skip_intro = Space, Return, Keypad Enter, Left Ctrl, Right Ctrl

[controller]
up = D-pad Up, Left Stick Up
down = D-pad Down, Left Stick Down
left = D-pad Left, Left Stick Left
right = D-pad Right, Left Stick Right
attack_select = A, RB, LB, Right Trigger
inventory = Y
pause = Start
end_turn = Back
abandon_quest = none
show_version = none
quit = none
quicksave = none
quickload = none
skip_intro = A, B, RB, LB, Right Trigger
